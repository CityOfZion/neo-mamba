name: CI
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PRIMARY_PYTHON: "3.13"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  linting:
    name: Lint (black)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: psf/black@stable
        with:
          options: "--check --diff"
          src: "neo3/ examples/ tests/"
          use_pyproject: true

  type-checking:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
     - uses: actions/checkout@v6
       with:
         persist-credentials: false
     - uses: actions/setup-python@v6
       with:
           python-version: ${{ env.PRIMARY_PYTHON }}
           cache: pip
           cache-dependency-path: pyproject.toml
     - name: Install dependencies
       run: pip install -e ".[dev,sctesting]"
     - name: Type check
       run: make type

  unit-tests:
    name: Unit tests ${{ matrix.os }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ ubuntu-24.04, windows-latest ]
        python-version: ["3.13", "3.14"]
        include:
          - os: ubuntu-24.04
            python-version: "3.13"
            coverage: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: | 
          pip install -e ".[dev,sctesting]"
          pip install coveralls
      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: make test

      - name: Run tests with coverage
        if: ${{ matrix.coverage }}
        run: coverage run -m unittest discover -v -s tests/

      - name: Upload coverage to Coveralls
        if: ${{ matrix.coverage }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: coveralls --service=github
